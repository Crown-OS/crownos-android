[package]
name = "crownos-android-daemon"
description = "CrownOS Android runtime manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "crown-androidd"
path = "src/main.rs"

[dependencies]
agent-wire.workspace = true
android-protocol.workspace = true
setup-state.workspace = true
runtime.workspace = true
splash.workspace = true
desktop-entries.workspace = true
venus.workspace = true
crownos-ipc.workspace = true
crownos-config.workspace = true
anyhow.workspace = true
serde.workspace = true
log.workspace = true
env_logger.workspace = true
rustix = { workspace = true, features = ["event", "process", "rand"] }
zbus = { workspace = true, features = ["async-io"] }
signal-hook = "0.3"
tar = { version = "0.4", default-features = false }
zstd = { version = "0.13", default-features = false }

[lints]
workspace = true
