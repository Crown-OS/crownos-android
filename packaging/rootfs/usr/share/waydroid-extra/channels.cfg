# The CrownOS image channel. crownos-android-setup writes it under
# /var/lib/crownos/android/channel in Waydroid's OTA layout, listing only the
# images the installed bundle pins:
#   system/lineage/waydroid_<arch>/<VANILLA|GAPPS>.json
#   vendor/waydroid_<arch>/MAINLINE.json
# Waydroid's initializer skips its polkit check when a request names these
# channels, and `waydroid upgrade` never sees an image the bundle was not tested with.
[channels]
system_channel = file:///var/lib/crownos/android/channel/system
vendor_channel = file:///var/lib/crownos/android/channel/vendor
rom_type = lineage
system_type = VANILLA
