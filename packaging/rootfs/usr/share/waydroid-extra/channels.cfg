# Waydroid's initializer lets ANY local user start `waydroid init` over D-Bus,
# without polkit, when the request names the channels in this file. The
# request's system_type is joined into the channel path unchecked, so a local
# channel here would let them steer which image root installs. These channels
# point at a host that never resolves (RFC 2606), so that unauthenticated path
# fails at its first fetch. crownos-android-setup runs `waydroid init` itself,
# as root, with the pinned local channel passed through -c and -v.
[channels]
system_channel = https://crownos.invalid/system
vendor_channel = https://crownos.invalid/vendor
rom_type = lineage
system_type = VANILLA
